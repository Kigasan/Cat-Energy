<!DOCTYPE html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Название проекта</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/index.js" defer></script>
  </head>
  <body class="page__body">
    <div class="wrapper">
      <header class="header">
        <div class="header__wrapper">
          <nav class="header__nav">
            <a href="#" class="header__logo-link">
              <picture>
                <source
                  type="image/svg+xml"
                  media="(min-width: 1440px)"
                  srcset="./images/logo-desktop.svg"
                  width="202"
                  height="59"
                />
                <source
                  type="image/svg+xml"
                  media="(min-width: 768px)"
                  srcset="./images/logo-tablet.svg"
                  width="174"
                  height="50"
                />
                <img
                  class="header__logo"
                  width="190"
                  height="38"
                  src="./images/logo-mobile.svg"
                  alt="Логотип cat energy"
                />
              </picture>
            </a>
            <button class="header__burger-button"><span class="visually-hidden">Открыть/закрыть меню</span></button>
            <ul class="header__menu list-reset">
              <li class="header__item">
                <a href="#" class="header__link header__link--current">главная</a>
              </li>
              <li class="header__item">
                <a href="#" class="header__link">каталог продукции</a>
              </li>
              <li class="header__item">
                <a href="#" class="header__link">подбор программы</a>
              </li>
            </ul>
          </nav>
          <section class="header__promo promo">
            <h1 class="promo__title">Функциональное питание для котов</h1>
            <p class="promo__subtitle">Занялся собой? Займись котом!</p>
            <img src="#" alt="Банка корма cat energy" class="promo__product-image">
            <link rel="stylesheet" href="#" class="promo__link">
          </section>
        </div>
      </header>
      <footer class="page-footer"></footer>
    </div>
  </body>
</html>
