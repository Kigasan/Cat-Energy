<!DOCTYPE html>
<html class="page" lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Название проекта</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="styles/styles.css">
    <script src="scripts/index.js" defer></script>
  </head>
  <body class="page__body">
    <div class="wrapper">
      <header class="header">
        <div class="header__wrapper">
          <nav class="header__nav">
            <a href="#" class="header__logo-link">
              <picture>
                <source
                  type="image/svg+xml"
                  media="(min-width: 1440px)"
                  srcset="./images/logo-desktop.svg"
                  width="202"
                  height="59"
                />
                <source
                  type="image/svg+xml"
                  media="(min-width: 768px)"
                  srcset="./images/logo-tablet.svg"
                  width="174"
                  height="50"
                />
                <img
                  class="header__logo"
                  width="190"
                  height="38"
                  src="./images/logo-mobile.svg"
                  alt="Логотип cat energy"
                />
              </picture>
            </a>
            <button class="header__burger-button"><span class="visually-hidden">Открыть/закрыть меню</span></button>
            <ul class="header__menu list-reset">
              <li class="header__item">
                <a href="#" class="header__link header__link--current">главная</a>
              </li>
              <li class="header__item">
                <a href="#" class="header__link">каталог продукции</a>
              </li>
              <li class="header__item">
                <a href="#" class="header__link">подбор программы</a>
              </li>
            </ul>
          </nav>
          <section class="header__promo promo">
            <h1 class="promo__title">Функциональное<br>питание для котов</h1>
            <p class="promo__subtitle">Занялся собой? Займись котом!</p>
            <picture>
              <source
                type="image/webp"
                media="(min-width: 1440px)"
                width="552"
                height="499"
                srcset="
                  ./images/promo_img-desktop@1x.webp 1x,
                  ./images/promo_img-desktop@2x.webp 2x
                "
              />
              <source
                type="image/webp"
                media="(min-width: 768px)"
                width="709"
                height="609"
                srcset="
                  ./images/promo_img-tablet@1x.webp 1x,
                  ./images/promo_img-tablet@2x.webp 2x
                "
              />
              <source
                type="image/webp"
                width="280"
                height="270"
                srcset="
                  ./images/promo_img-mobile@1x.webp 1x,
                  ./images/promo_img-mobile@2x.webp 2x
                "
              />
              <source
                type="image/png"
                media="(min-width: 1440px)"
                width="552"
                height="499"
                srcset="
                  ./images/promo_img-desktop@1x.png 1x,
                  ./images/promo_img-desktop@2x.png 2x
                "
              />
              <source
                type="image/png"
                media="(min-width: 768px)"
                width="709"
                height="609"
                srcset="
                  ./images/promo_img-tablet@1x.png 1x,
                  ./images/promo_img-tablet@2x.png 2x
                "
              />

              <img
                class="promo__product-image"
                src="./images/promo_img-mobile@1x.png"
                srcset="./images/promo_img-mobile@2x.png"
                alt="Банка корма cat energy"
                width="280"
                height="270"
              />
            </picture>
            <!-- <img src="./images/" alt="" class="promo__product-image"> -->
            <a href="#" class="promo__link">подобрать программу</a>
          </section>
        </div>
      </header>
      <footer class="page-footer"></footer>
    </div>
  </body>
</html>
